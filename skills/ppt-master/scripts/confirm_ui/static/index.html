<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page_title">Hedgehog Master - Confirm Design</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div id="app">
        <aside id="preview-panel" aria-label="Design preview">
            <div class="brand-block">
                <div class="brand-mark">HM</div>
                <div>
                    <div class="panel-kicker">Hedgehog Master</div>
                    <div class="panel-title" data-i18n="page_title">Hedgehog Master - Confirm Design</div>
                </div>
            </div>
            <div id="topbar-preview"></div>
        </aside>

        <section id="control-panel">
            <header id="topbar">
                <div id="topbar-inner">
                    <div class="topbar-titles">
                        <h1 data-i18n="page_title">Hedgehog Master - Confirm Design</h1>
                        <p id="topbar-hint" data-i18n="topbar_hint">After confirming, return to the chat and say “done”.</p>
                    </div>
                </div>
            </header>

            <main id="form">
                <div id="loading" data-i18n="loading">Loading recommendations…</div>
                <div id="error" style="display:none;"></div>
                <div id="sections" style="display:none;"></div>
            </main>
            <footer id="actionbar" style="display:none;">
                <span id="confirm-status"></span>
                <button id="btn-confirm" data-i18n="btn_confirm">Confirm</button>
            </footer>
        </section>
    </div>

    <div id="confirmed-overlay" style="display:none;">
        <div class="cf-card">
            <div class="cf-title">✓ Confirmed</div>
            <div class="cf-hint">Your choices are saved. You can close this page.</div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
